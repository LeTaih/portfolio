    { titre: 'Silo', affiche: '/dxktdopZCOlff10ocoEdn2TXBzl.jpg', ep: 'S4E1 · Épisode 1', quand: '8 juil. · dans 9 mois' }
  ];
  // Le reste au volet : Carnets E51–E60, Slow Horses E6, Tulsa King E2–E10
  var SUITE = 20;
  var A_COMMENCER = { titre: 'Task', affiche: '/mDpbYGDRx98OXlXyPJMtGftQJaS.jpg', ep: 'S1E1 · La croisée des chemins', reste: 7 };

  var CHECK = function (taille) {
    return '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4 8.5-8.5"/></svg>';
  };
  var TITRE_SECTION = 'text-[13px] font-semibold uppercase tracking-wider text-white/40';

  function carte(c) {
    return '<li class="carte">' +
      '<img class="halo" alt="" src="' + IMG + 'w154' + c.affiche + '">' +
      '<div class="contenu">' +
        '<img class="affiche" alt="" src="' + IMG + 'w342' + c.affiche + '">' +
        '<span class="textes"><span class="titre">' + c.titre + '</span>' +
          '<span class="episode">' + c.ep + '</span>' +
          '<span class="reste">' + c.reste + ' épisode' + (c.reste > 1 ? 's' : '') + ' à voir</span></span>' +
        '<span class="coche">' + CHECK(26) + '</span>' +
      '</div></li>';
  }
  // SortieRow (sortie-row.tsx)
  function sortie(s) {
    return '<li class="relative overflow-hidden rounded-3xl bg-voile inset-ring-1 inset-ring-filet backdrop-blur-surface shadow-reflet">' +
      '<img class="halo" alt="" src="' + IMG + 'w154' + s.affiche + '">' +
      '<a class="relative flex items-center gap-3 p-3">' +
        '<img src="' + IMG + 'w342' + s.affiche + '" alt="" class="h-24 w-16 shrink-0 rounded-xl object-cover">' +
        '<span class="min-w-0 flex-1">' +
          '<span class="block truncate font-medium">' + s.titre + '</span>' +
          '<span class="mt-0.5 block truncate text-sm text-white/60">' + s.ep + '</span>' +
          '<span class="mt-1 block text-xs tabular-nums text-white/40">' + s.quand + '</span>' +
        '</span>' +
      '</a></li>';
  }

  var accueil = document.getElementById('accueil');
  accueil.innerHTML =
    '<header class="mb-6"><h1 class="text-3xl font-bold tracking-tight">Pile</h1></header>' +
    '<section><h2 class="' + TITRE_SECTION + '">À regarder</h2>' +
      '<nav class="mb-4 mt-3 flex gap-2"><span class="tri ici">À rattraper</span><span class="tri">Récent</span><span class="tri">A-Z</span></nav>' +
      '<ul class="flex flex-col gap-3">' + A_REGARDER.map(carte).join('') + '</ul></section>' +
    '<section class="mt-9"><h2 class="' + TITRE_SECTION + '">À venir</h2>' +
      '<ul class="mt-3 flex flex-col gap-3">' + A_VENIR.map(sortie).join('') + '</ul>' +
      '<div class="mt-3" id="volet"><div class="flex min-h-11 items-center justify-center rounded-full bg-voile px-4 text-sm text-white/60 inset-ring-1 inset-ring-filet backdrop-blur-controle">Voir ' + SUITE + ' autres sorties</div></div>' +
    '</section>' +
    '<section class="mt-9"><h2 class="' + TITRE_SECTION + '">À commencer</h2>' +
      '<ul class="mt-3 flex flex-col gap-3">' + carte(A_COMMENCER) + '</ul></section>';

  var ecran = document.getElementById('ecran');
  var doigt = document.getElementById('doigt');
  var defile = document.getElementById('defile');
  var pages = document.getElementById('pages');
  var notif = document.getElementById('notif');

  var echelle = 1;
  function ajuster() {
    echelle = window.innerWidth / 390;
    ecran.style.transform = 'scale(' + echelle + ')';
    document.body.style.height = (844 * echelle) + 'px';
  }
  ajuster();
  window.addEventListener('resize', ajuster);

  function bezier(x1, y1, x2, y2) {
    function a(p1, p2) { return 1 - 3 * p2 + 3 * p1; }
    function b(p1, p2) { return 3 * p2 - 6 * p1; }
    function c(p1) { return 3 * p1; }
    function calc(t, p1, p2) { return ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t; }
    function pente(t, p1, p2) { return 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1); }
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x;
      for (var i = 0; i < 8; i++) {
        var d = pente(t, x1, x2);
        if (Math.abs(d) < 1e-6) break;
        t -= (calc(t, x1, x2) - x) / d;
      }
      t = Math.min(1, Math.max(0, t));
      return calc(t, y1, y2);
    };
  }
  var easeOut = bezier(0, 0, 0.2, 1);       // Tailwind ease-out
  var easeInOut = bezier(0.4, 0, 0.2, 1);   // Tailwind ease-in-out
  function seg(t, a, b, f) {
    if (t <= a) return 0;
    if (t >= b) return 1;
    return (f || easeOut)((t - a) / (b - a));
  }
  function lerp(a, b, p) { return a + (b - a) * p; }

  // Un défilement au doigt : le contenu suit le doigt (accélération), puis
  // file sur sa lancée et ralentit comme un UIScrollView (décroissance
  // exponentielle, vitesse continue au lâcher).
  function defilement(t, g) {
    var duree = g.t1 - g.t0;
    if (t <= g.t0) return 0;
    if (t < g.t1) {
      var p = (t - g.t0) / duree;
      return g.drag * (1.5 * p * p - 0.5 * p * p * p);
    }
    if (g.coast <= 0) return g.drag;
    var vitesse = 1.5 * g.drag / duree;
    var tau = g.coast / vitesse;
    var x = Math.min(4, (t - g.t1) / tau);
    return g.drag + g.coast * (1 - Math.exp(-x)) / (1 - Math.exp(-4));
  }

  // ---------------------------------------------------------------- mesures
  function haut(el, conteneur) {
    var y = 0;
    while (el && el !== conteneur) { y += el.offsetTop; el = el.offsetParent; }
    return y;
  }
  function gauche(el, conteneur) {
    var x = 0;
    while (el && el !== conteneur) { x += el.offsetLeft; el = el.offsetParent; }
    return x;
  }
  function centre(el, conteneur) {
    return { x: gauche(el, conteneur) + el.offsetWidth / 2, y: haut(el, conteneur) + el.offsetHeight / 2 };
  }


  // Le ressort de la bannière iOS : arrive vite, dépasse à peine, se pose.
  function ressort(p) {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    return 1 - Math.exp(-6.5 * p) * Math.cos(7.5 * p) * (1 - p * 0.15);
  }

  // ---------------------------------------------------------------- scénario
  var DUREE = 10.9;
  var T = {
    notifEntre: 0.7, notifSort: 3.55,
    g: { apparait: 4.05, t0: 4.30, t1: 4.85 },
    fondu: 9.6, remise: 10.2, retour: 10.3
  };
  var NOTIF_Y = 52; // sous la barre d'état et l'îlot
  var M = null;
  function mesurer() {
    var volet = document.getElementById('volet');
    // Le défilement s'arrête quand le volet « Voir 20 autres sorties » se pose
    // au-dessus de la barre d'onglets (haut à 755).
    var S = haut(volet, defile) + volet.offsetHeight - 737;
    var drag = S / 2.36;
    M = { S: S, g: { t0: T.g.t0, t1: T.g.t1, drag: drag, coast: S - drag } };
  }

  function rendre(t, tReel) {
    if (!M) mesurer();
    if (t >= T.remise) t = 0;

    // --- la notification
    var entre = ressort(Math.max(0, (t - T.notifEntre) / 0.75));
    var sort = seg(t, T.notifSort, T.notifSort + 0.38, bezier(0.4, 0, 1, 1));
    var y = lerp(-120, NOTIF_Y, entre) - (NOTIF_Y + 130) * sort;
    notif.style.opacity = (t < T.notifEntre ? 0 : Math.min(1, (t - T.notifEntre) / 0.12) * (1 - sort * sort)).toFixed(3);
    notif.style.transform = 'translate3d(0,' + y.toFixed(2) + 'px,0) scale(' + lerp(0.96, 1, Math.min(1, entre)).toFixed(4) + ')';

    // --- le défilement
    var s = defilement(t, M.g);
    defile.style.transform = 'translate3d(0,' + (-s).toFixed(2) + 'px,0)';

    // --- le doigt : il pousse la page vers le haut, puis se lève
    var g = T.g;
    var dEntre = seg(t, g.apparait, g.apparait + 0.25);
    var leve = seg(t, g.t1, g.t1 + 0.3);
    var tire = defilement(Math.min(t, g.t1), M.g);
    var op = dEntre * (1 - leve);
    var ech = lerp(1.25, 1, dEntre) * lerp(1, 0.86, seg(t, g.t0, g.t0 + 0.1)) * lerp(1, 1 / 0.86, leve);
    doigt.style.opacity = (op * 0.95).toFixed(3);
    doigt.style.transform = 'translate3d(238px,' + (690 - tire - 30 * leve).toFixed(2) + 'px,0) scale(' + ech.toFixed(4) + ')';

    // --- fondu de bouclage
    var fondu = 1;
    if (tReel >= T.fondu && tReel < T.remise) fondu = 1 - seg(tReel, T.fondu, T.remise, easeInOut);
    else if (tReel >= T.remise && tReel < T.retour) fondu = 0;
    else if (tReel >= T.retour) fondu = seg(tReel, T.retour, DUREE, easeInOut);
    pages.style.opacity = fondu.toFixed(3);
  }

  function rendreA(t) { rendre(t, t); }

  // ---------------------------------------------------------------- lecture
  var params = new URLSearchParams(location.search);
  var fige = params.get('t');
  var reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // État fixe représentatif : la colonne « À venir » et ses dates, sans doigt.
  var REPRESENTATIF = 7.5;

  var pret = [document.fonts ? document.fonts.ready : Promise.resolve()];
  Array.prototype.forEach.call(document.images, function (img) {
    if (!img.complete) pret.push(new Promise(function (ok) { img.onload = img.onerror = ok; }));
  });
  var attente = Promise.race([Promise.all(pret), new Promise(function (ok) { setTimeout(ok, 2500); })]);

  if (fige !== null || reduit) {
    var instant = fige !== null ? (parseFloat(fige) || 0) : REPRESENTATIF;
    rendreA(instant);
    if (reduit && fige === null) doigt.style.display = 'none';
    attente.then(function () { M = null; rendreA(instant); });
    return;
  }

  var debut = null;
  function image(maintenant) {
    if (debut === null) debut = maintenant;
    rendreA(((maintenant - debut) / 1000) % DUREE);
    requestAnimationFrame(image);
  }
  rendreA(0);
  attente.then(function () { M = null; requestAnimationFrame(image); });

  var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) { if (e.matches) location.reload(); });
  }
})();
</script>
