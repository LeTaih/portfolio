.pa-rang {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.pa-rang--2 { grid-template-columns: 1fr 1fr; }
.pa-rang + .pa-rang { border-top: 3px solid var(--pa-encre); }
.pa-b {
  min-height: clamp(3.5rem, 88.62px, 5.6rem);
  border: 0;
  border-right: 3px solid var(--pa-encre);
  font-family: var(--pa-titre);
  font-size: clamp(1.25rem, 23.4px, 1.6rem);
  text-transform: uppercase;
  cursor: pointer;
}
.pa-rang > .pa-b:last-child { border-right: 0; }
.pa-b--noir { background: var(--pa-noir); color: #fff; }
.pa-b--violet { background: var(--lilas); color: var(--pa-encre); }
.pa-b--rouge { background: var(--pa-rouge); color: #fff; }
.pa-b--hb { background: var(--text); color: var(--pa-encre); }
.pa-b[data-pris] { background: var(--acide); color: var(--pa-encre); }
.pa-b:disabled { cursor: default; opacity: 0.4; }
.pa-pave[data-verrou] .pa-b:disabled { opacity: 1; }
.pa-b:active:not(:disabled) { filter: brightness(0.86); }
.pa-b:focus-visible { outline: 3px solid var(--acide); outline-offset: -6px; }
.pa-table[data-rate] .navbar,
.pa-table[data-rate] .pa-bande,
.pa-table[data-rate] .pa-pave {
  filter: grayscale(1);
  opacity: 0.45;
  transition: opacity 0.3s ease, filter 0.3s ease;
}
.pa-table[data-rate] .pa-tete { visibility: hidden; min-height: 8.5rem; }
.pa-rate {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--pa-rouge);
}
.pa-chiffre--rate { color: var(--pa-rouge-sombre); }
.pa-chiffre--rate > span { animation: paAbat 0.6s 0.15s cubic-bezier(0.3, 1.45, 0.5, 1) both; }
@keyframes paAbat {
  from { transform: translateY(-115%); }
  to { transform: none; }
}
.pa-flash {
  position: absolute;
  inset: 0;
  z-index: 70;
  background: #fff;
  pointer-events: none;
  animation: paEclair 0.5s ease-out both;
}
@keyframes paEclair {
  0%, 30% { opacity: 1; }
  100% { opacity: 0; }
}
.pa-rate-tete {
  position: absolute;
  z-index: 2;
  top: var(--pa-haut);
  inset-inline: 1.1rem;
}
.pa-rate-sous {
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  color: #fff;
  animation: paFondu 0.2s 0.4s both;
}
.pa-rate-titre {
  margin-top: 0.6rem;
  font-family: var(--pa-titre);
  font-size: clamp(3.4rem, 78px, 6.5rem);
  line-height: 0.9;
  text-transform: uppercase;
  color: #fff;
  overflow-wrap: anywhere;
  transform-origin: left center;
  animation: paTamponne 0.28s 0.14s cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
}
@keyframes paTamponne {
  0% { opacity: 0; transform: rotate(-14deg) scale(1.5); filter: blur(3px); }
  100% { opacity: 1; transform: rotate(-4deg) scale(1); filter: none; }
}
.pa-rate-touche {
  position: absolute;
  inset: 0;
  z-index: 60;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.pa-rate-touche:disabled { cursor: default; }
.pa-rate-invite {
  margin-top: 0.7rem;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--pa-encre);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.pa-rate-invite[data-arme] { opacity: 1; }
@keyframes paFondu {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes paPasse {
  0% { opacity: 0; }
  15% { opacity: 1; }
  75% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .pa-sticker,
  .pa-rate-marque,
  .pa-rate-titre { animation: paFondu 0.2s ease-out both; }
  .pa-flash { display: none; }
  .pa-chiffre--rate > span { animation: paFondu 0.2s ease-out both; }
  .pa-fleches { display: none; }
  .pa-table,
  .pa-chiffre { transition: none; }
  .pa-tampon-pari { animation-name: paPasse; }
  .pa-chiffre > [data-monte] { animation: none; }
  .pa-pave { transition: none; }
}

</style>
<style>
html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #4a0f8a; }
#cy-stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; overflow: hidden;
  background: #4a0f8a; font-family: 'Archivo', system-ui, sans-serif; color: var(--text); }
#cy-host { position: absolute; inset: 0; }
#cy-host, #cy-host * { pointer-events: none; }
/* L'appui du doigt : la règle :active de purple.css, rejouée par une classe. */
.pa-b.cy-press:not(:disabled) { filter: brightness(0.86); }
/* Le doigt fictif : un disque blanc translucide (le même que cy-blackjack). */
#cy-finger, #cy-ripple { position: absolute; left: 0; top: 0; z-index: 500; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; pointer-events: none; opacity: 0; will-change: transform, opacity; }
#cy-finger { background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.42), rgba(255,255,255,0.22) 70%);
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.45), 0 8px 22px -8px rgba(0,0,0,0.7); }
#cy-ripple { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.6); }
@media (prefers-reduced-motion: reduce) { #cy-finger, #cy-ripple { display: none; } }
</style>
