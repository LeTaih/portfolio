  fiche.innerHTML =
    retour() +
    '<div class="mt-4">' +
      '<div class="flex items-start gap-3">' +
        '<img src="' + IMG + 'w342' + SERIE.affiche + '" alt="" class="h-24 w-16 shrink-0 rounded-xl object-cover">' +
        '<div class="min-w-0 flex-1">' +
          '<img class="logo" src="' + IMG + 'w300' + SERIE.logo + '" alt="">' +
          '<p class="mt-1.5 text-sm text-white/40">' + SERIE.meta + '</p>' +
          '<p class="mt-1 text-sm text-white/60"><span class="font-semibold tabular-nums text-white">' + SERIE.note + '</span><span class="text-white/40"> /10 · ' + SERIE.votes + ' votes</span></p>' +
        '</div>' +
      '</div>' +
      '<p class="mt-3 text-sm italic text-white/60">« ' + SERIE.accroche + ' »</p>' +
    '</div>' +
    '<p class="mt-3 text-sm leading-relaxed text-white/60">' + SERIE.resume + '</p>' +
    // BandeAnnonce : vignette YouTube (copiée à côté), voile, pilule de verre
    '<div class="mt-4"><div class="relative block aspect-video w-full overflow-hidden rounded-3xl inset-ring-1 inset-ring-filet shadow-reflet">' +
      '<img src="wt-fiche/bande-annonce.jpg" alt="" class="absolute inset-0 h-full w-full object-cover">' +
      '<span class="absolute inset-0 bg-black/30"></span>' +
      '<span class="absolute inset-0 flex items-center justify-center"><span class="flex items-center gap-2 rounded-full bg-voile-fort px-5 py-3 text-sm font-medium text-white inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>Bande-annonce</span></span>' +
    '</div></div>' +
    plateformes('Où la regarder') +
    // StatutSuivi
    '<div class="mt-4"><div class="flex flex-wrap items-center gap-2"><div class="flex flex-wrap gap-2">' +
      '<span class="' + PILULE_STATUT + ACTIVE + '">En cours</span>' +
      '<span class="' + PILULE_STATUT + REPOS + '">Terminée</span>' +
      '<span class="' + PILULE_STATUT + REPOS + '">Abandonnée</span>' +
      '<span class="' + PILULE_STATUT + REPOS + '">À voir</span>' +
    '</div><span class="' + PILULE_STATUT + 'w-14 justify-center ' + REPOS + '">' + CLOCHE + '</span></div></div>' +
    // SeasonTabs
    '<div class="mt-5"><nav class="-mx-4 mb-4 flex gap-2 px-4 pb-1">' +
      '<span class="flex shrink-0 items-center gap-1 rounded-full px-3 py-1.5 text-sm inset-ring-1 bg-white font-medium text-neutral-950 inset-ring-white">' +
      '<span class="max-w-40 truncate">Saison 1</span><span class="tabular-nums text-neutral-950/50" id="compte"> 2/9</span></span>' +
    '</nav></div>' +
    '<ul class="flex flex-col gap-1" id="liste">' + lignes + '</ul>' +
    // « J'en suis là »
    '<div class="mt-6 flex gap-2" id="formulaire">' +
      '<span class="choix min-w-0 flex-1 rounded-full bg-voile px-4 py-3 text-sm inset-ring-1 inset-ring-filet"><span class="truncate" id="choix">S1E6 — POH</span>' +
        '<svg class="fleche" width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 6 7.5l4-4"/></svg></span>' +
      '<span class="rounded-full bg-white px-5 py-3 text-sm font-semibold text-neutral-950" id="jensuis">J’en suis là</span>' +
    '</div>' +
    '<p class="mt-2 text-xs text-white/40">Marque comme vus tous les épisodes jusqu’à celui choisi, saisons précédentes comprises.</p>' +
    // MarquageBloc
    '<div class="mt-4"><div class="flex flex-wrap gap-2">' +
      ['Saison vue', 'Effacer la saison', 'Série vue', 'Effacer la série'].map(function (l) {
        return '<span class="flex min-h-11 flex-1 items-center justify-center rounded-full px-3 text-xs inset-ring-1 ' + REPOS + '">' + l + '</span>';
      }).join('') +
    '</div><p class="mt-2 text-xs text-white/40">Ne compte que les épisodes déjà diffusés. Effacer retire tous les passages.</p></div>' +
    '<div class="mt-8">' + blocNote('Ton mot sur cette œuvre', 'noteOeuvre') + '</div>' +
    '<div class="mt-4"><div class="flex flex-col gap-2"><span class="flex h-11 shrink-0 self-start items-center rounded-full bg-voile-fort px-4 text-sm font-medium text-white inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet">Ajouter à une liste</span></div></div>' +
    '<div class="mt-3"><div class="flex flex-col gap-2"><span class="flex h-11 shrink-0 items-center justify-center rounded-full bg-voile-fort px-4 text-sm font-medium text-white inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet">Conseiller à un ami</span></div></div>';

  // ---------------------------------------------------------------- l'épisode
  var episode = document.getElementById('episode');
  episode.innerHTML =
    retour() +
    '<img src="' + IMG + 'w780' + EP6.image + '" alt="" class="mt-4 w-full rounded-3xl object-cover" style="aspect-ratio:780/439">' +
    '<a class="mt-4 block truncate text-sm text-white/60">' + SERIE.titre + '</a>' +
    '<p class="mt-1 text-sm text-white/40">' + EP6.meta + '</p>' +
    '<h1 class="mt-0.5 text-xl font-semibold tracking-tight">POH</h1>' +
    '<p class="mt-3 text-sm leading-relaxed text-white/70">' + EP6.resume + '</p>' +
    '<p class="mt-3 text-sm text-white/40">' + EP6.vuLe + '</p>' +
    // EpisodeActions, compté une fois
    '<div class="mt-4">' +
      '<p class="flex min-h-11 w-full items-center justify-center gap-2 rounded-full px-4 text-sm inset-ring-1 bg-white font-semibold text-neutral-950 inset-ring-white">' + CHECK(16) + 'Vu</p>' +
      '<div class="mt-2 flex gap-2">' +
        '<span class="flex min-h-11 flex-1 items-center justify-center gap-2 rounded-full px-4 text-sm inset-ring-1 bg-voile text-white/70 inset-ring-filet backdrop-blur-controle shadow-reflet">Revu</span>' +
        '<span class="flex min-h-11 flex-1 items-center justify-center gap-2 rounded-full px-4 text-sm inset-ring-1 bg-voile text-white/70 inset-ring-filet backdrop-blur-controle shadow-reflet">Retirer</span>' +
      '</div>' +
    '</div>' +
    plateformes('Où regarder la série') +
    // CorrigerDate, replié
    '<div class="mt-2"><div class="flex min-h-11 items-center justify-center text-sm text-white/40">Corriger la date</div></div>' +
    '<div class="mt-5">' + blocNote('Ton mot sur cet épisode', 'noteEp') + '</div>' +
    '<nav class="mt-8 flex justify-between border-t border-filet pt-4 text-sm"><span class="text-white/60">‹ S1E5</span><span class="text-white/60">S1E7 ›</span></nav>';

  // ---------------------------------------------------------------- références
  var ecran = document.getElementById('ecran');
  var doigt = document.getElementById('doigt');
  var annulation = document.getElementById('annulation');
  var pageFiche = document.getElementById('pageFiche');
  var pageEpisode = document.getElementById('pageEpisode');
  var defileFiche = document.getElementById('defileFiche');
  var defileEpisode = document.getElementById('defileEpisode');
  var pages = document.getElementById('pages');
  var compte = document.getElementById('compte');
  var choix = document.getElementById('choix');
  var jensuis = document.getElementById('jensuis');
  var noteEpBloc = document.getElementById('noteEpBloc');
  var li = Array.prototype.slice.call(document.querySelectorAll('#liste li'));
  var rangs = li.map(function (l) {
    return { li: l, lien: l.querySelector('.lien'), etat: l.querySelector('.etat'), coche: l.querySelector('.coche'), moins: l.querySelector('.moins'), vu: null };
  });
  var pastillesEp = Array.prototype.slice.call(document.querySelectorAll('#noteEp .pastille')).map(function (p) {
    return { p: p, plein: p.querySelector('.plein'), b: p.querySelector('b') };
  });

  // ---------------------------------------------------------------- mise à l'échelle
  var echelle = 1;
  function ajuster() {
    echelle = window.innerWidth / 390;
    ecran.style.transform = 'scale(' + echelle + ')';
    document.body.style.height = (844 * echelle) + 'px';
  }
  ajuster();
  window.addEventListener('resize', ajuster);

  // ---------------------------------------------------------------- courbes
  function bezier(x1, y1, x2, y2) {
    function a(p1, p2) { return 1 - 3 * p2 + 3 * p1; }
    function b(p1, p2) { return 3 * p2 - 6 * p1; }
    function c(p1) { return 3 * p1; }
    function calc(t, p1, p2) { return ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t; }
    function pente(t, p1, p2) { return 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1); }
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x;
      for (var i = 0; i < 8; i++) {
        var d = pente(t, x1, x2);
        if (Math.abs(d) < 1e-6) break;
        t -= (calc(t, x1, x2) - x) / d;
      }
      t = Math.min(1, Math.max(0, t));
      return calc(t, y1, y2);
    };
  }
  var easeOut = bezier(0, 0, 0.2, 1);       // Tailwind ease-out
  var easeInOut = bezier(0.4, 0, 0.2, 1);   // Tailwind ease-in-out
  function seg(t, a, b, f) {
    if (t <= a) return 0;
    if (t >= b) return 1;
    return (f || easeOut)((t - a) / (b - a));
  }
  function lerp(a, b, p) { return a + (b - a) * p; }

  // Un défilement au doigt : le contenu suit le doigt (accélération), puis
  // file sur sa lancée et ralentit comme un UIScrollView (décroissance
  // exponentielle, vitesse continue au lâcher).
  function defilement(t, g) {
    var duree = g.t1 - g.t0;
    if (t <= g.t0) return 0;
    if (t < g.t1) {
      var p = (t - g.t0) / duree;
      return g.drag * (1.5 * p * p - 0.5 * p * p * p);
    }
    if (g.coast <= 0) return g.drag;
    var vitesse = 1.5 * g.drag / duree;
    var tau = g.coast / vitesse;
    var x = Math.min(4, (t - g.t1) / tau);
    return g.drag + g.coast * (1 - Math.exp(-x)) / (1 - Math.exp(-4));
  }

  // ---------------------------------------------------------------- mesures
  function haut(el, conteneur) {
    var y = 0;
    while (el && el !== conteneur) { y += el.offsetTop; el = el.offsetParent; }
    return y;
  }
  function gauche(el, conteneur) {
    var x = 0;
    while (el && el !== conteneur) { x += el.offsetLeft; el = el.offsetParent; }
    return x;
  }
  function centre(el, conteneur) {
    return { x: gauche(el, conteneur) + el.offsetWidth / 2, y: haut(el, conteneur) + el.offsetHeight / 2 };
  }

  // ---------------------------------------------------------------- scénario
  var DUREE = 12.7;
  var T = {
    g1: { apparait: 0.85, t0: 1.10, t1: 1.62 },
    coche: { apparait: 2.70, appui: 3.00, lache: 3.12 }, majCoche: 3.48,
    g2: { apparait: 3.78, t0: 3.98, t1: 4.36 },
    jensuis: { apparait: 4.58, appui: 4.82, lache: 4.94 }, majJensuis: 5.36,
    ligne: { apparait: 5.75, appui: 5.98, lache: 6.08 }, navigue: 6.26,
    g3: { apparait: 7.05, t0: 7.30, t1: 7.84 },
    note: { apparait: 8.95, appui: 9.20, lache: 9.32 }, noteServeur: 9.75,
    bandeau: 3.48,
    fondu: 11.35, remise: 11.95, retour: 12.05
  };
  var M = null; // mesures de mise en page, prises une fois polices et images posées
  function mesurer() {
    var liste = document.getElementById('liste');
    var form = document.getElementById('formulaire');
    var hautListe = haut(liste, defileFiche);
    // 1. les onglets de saison sous la barre d'état, la liste entière à l'écran
    var S1 = hautListe - 118;
    // 2. de quoi dégager « J'en suis là » du bandeau d'annulation (haut à 670) :
    //    la liste remonte jusqu'en haut, les onglets passent sous la barre d'état
    var basForm = haut(form, defileFiche) + form.offsetHeight;
    var S2 = Math.max(122, basForm - S1 - 600);
    // 3. sur l'épisode : les pastilles au milieu de l'écran
    var S3 = haut(document.getElementById('noteEp'), defileEpisode) - 500;
    M = {
      S1: S1, S2: S2, S3: S3,
      g1: { t0: T.g1.t0, t1: T.g1.t1, drag: Math.min(380, S1 * 0.5), coast: S1 - Math.min(380, S1 * 0.5) },
      g2: { t0: T.g2.t0, t1: T.g2.t1, drag: S2 * 0.8, coast: S2 * 0.2 },
      g3: { t0: T.g3.t0, t1: T.g3.t1, drag: S3 * 0.55, coast: S3 * 0.45 }
    };
  }

  // L'apparition, l'appui et le lâcher d'un doigt sur une cible
  function toucher(t, k) {
    var entre = seg(t, k.apparait, k.apparait + 0.25);
    var sort = seg(t, k.lache, k.lache + 0.35);
    return {
      op: entre * (1 - sort),
      echelle: lerp(1.25, 1, entre) * lerp(1, 0.86, seg(t, k.appui, k.appui + 0.1)) * lerp(1, 1 / 0.86, sort),
      dx: 10 * (1 - entre), dy: 14 * (1 - entre)
    };
  }
  function presse(t, k, ampleur) {
    return 1 - ampleur * seg(t, k.appui, k.appui + 0.1) * (1 - seg(t, k.lache, k.lache + 0.25));
  }

  function poser(el, prop, valeur) {
    if (el['_' + prop] !== valeur) { el.style[prop] = valeur; el['_' + prop] = valeur; }
  }

  function rendre(t, tReel) {
    if (!M) mesurer();
    if (t >= T.remise) t = 0; // l'état initial, prêt pour le fondu de retour

    // --- quelle page ? Next remplace l'écran ; on adoucit d'un fondu bref
    var vers = seg(t, T.navigue, T.navigue + 0.16, easeInOut);
    poser(pageFiche, 'opacity', (1 - vers).toFixed(3));
    poser(pageFiche, 'visibility', vers >= 1 ? 'hidden' : 'visible');
    poser(pageEpisode, 'opacity', vers.toFixed(3));
    poser(pageEpisode, 'visibility', vers <= 0 ? 'hidden' : 'visible');

    // --- défilements
    var sF = defilement(t, M.g1) + defilement(t, M.g2);
    var sE = defilement(t, M.g3);
    poser(defileFiche, 'transform', 'translate3d(0,' + (-sF).toFixed(2) + 'px,0)');
    poser(defileEpisode, 'transform', 'translate3d(0,' + (-sE).toFixed(2) + 'px,0)');

    // --- la liste : E1–E2 déjà vus, E3 coché, puis E4–E6 par « J'en suis là »
    var vus = 2 + (t >= T.majCoche ? 1 : 0) + (t >= T.majJensuis ? 3 : 0);
    rangs.forEach(function (r, i) {
      var vu = i < vus;
      if (r.vu !== vu) {
        r.vu = vu;
        r.etat.textContent = vu ? 'vu' : '';
        r.moins.style.display = vu ? 'flex' : 'none';
      }
    });
    var c = ' ' + vus + '/9';
    if (compte.textContent !== c) compte.textContent = c;
    // React remet le formulaire à zéro après l'action : le menu revient au premier épisode
    var ch = t >= T.majJensuis ? 'S1E1 — On, c’est nous' : 'S1E6 — POH';
    if (choix.textContent !== ch) choix.textContent = ch;

    // la coche de E3 : active:scale-90, puis disabled:opacity-50 le temps de l'action
    var coche3 = rangs[2].coche;
    poser(coche3, 'transform', 'scale(' + presse(t, T.coche, 0.1).toFixed(4) + ')');
    poser(coche3, 'opacity', (t >= T.coche.lache && t < T.majCoche) ? '0.5' : '1');
    poser(jensuis, 'transform', 'scale(' + presse(t, T.jensuis, 0.04).toFixed(4) + ')');

    // --- la note de l'épisode : les pastilles 1 à 7 blanchissent (300 ms ease-out)
    var pNote = seg(t, T.note.lache, T.note.lache + 0.3);
    pastillesEp.forEach(function (p, i) {
      var k = i < NOTE ? pNote : 0;
      p.plein.style.opacity = k.toFixed(3);
      var v = Math.round(lerp(255, 10, k));
      p.b.style.color = k > 0 ? 'rgb(' + v + ',' + v + ',' + v + ',' + lerp(0.5, 1, k).toFixed(3) + ')' : '';
      p.p.style.transform = i === NOTE - 1 ? 'scale(' + presse(t, T.note, 0.04).toFixed(4) + ')' : '';
    });
    // aria-busy : opacity-50 transition-opacity, le temps que setRating réponde
    var attente = t >= T.note.lache && t < T.noteServeur ? seg(t, T.note.lache, T.note.lache + 0.15, easeInOut) : 0;
    poser(noteEpBloc, 'opacity', (1 - 0.5 * attente).toFixed(3));

    // --- le bandeau « Vu S1E3 » (dix secondes : il tient jusqu'au fondu)
    var bIn = seg(t, T.bandeau, T.bandeau + 0.2);
    annulation.style.opacity = bIn.toFixed(3);
    annulation.style.transform = 'translate3d(0,' + (6 * (1 - bIn)).toFixed(2) + 'px,0)';

    // --- le doigt -----------------------------------------------------------
    var d = { op: 0, echelle: 1, x: 0, y: 0 };
    function surCible(k, el, conteneur, defile, decaleX) {
      var c = centre(el, conteneur);
      var f = toucher(t, k);
      d.op = f.op; d.echelle = f.echelle;
      d.x = c.x + (decaleX || 0) + f.dx;
      d.y = c.y - defile + f.dy;
    }
    function glisse(g, m, x, y0) {
      var entre = seg(t, g.apparait, g.apparait + 0.25);
      var leve = seg(t, g.t1, g.t1 + 0.3);
      var tire = defilement(Math.min(t, g.t1), m);
      d.op = entre * (1 - leve);
      d.echelle = lerp(1.25, 1, entre) * lerp(1, 0.86, seg(t, g.t0, g.t0 + 0.1)) * lerp(1, 1 / 0.86, leve);
      d.x = x;
      d.y = y0 - tire - 26 * leve;
    }
    if (t < T.g1.t1 + 0.4) glisse(T.g1, M.g1, 262, 660);
    else if (t < T.g2.apparait - 0.05) surCible(T.coche, rangs[2].coche, defileFiche, sF);
    else if (t < T.g2.t1 + 0.4) glisse(T.g2, M.g2, 214, 600);
    else if (t < T.ligne.apparait - 0.05) surCible(T.jensuis, jensuis, defileFiche, sF);
    else if (t < T.g3.apparait - 0.05) surCible(T.ligne, rangs[5].lien, defileFiche, sF, -70);
    else if (t < T.g3.t1 + 0.4) glisse(T.g3, M.g3, 250, 680);
    else surCible(T.note, pastillesEp[NOTE - 1].p, defileEpisode, sE);
    doigt.style.opacity = (d.op * 0.95).toFixed(3);
    doigt.style.transform = 'translate3d(' + d.x.toFixed(2) + 'px,' + d.y.toFixed(2) + 'px,0) scale(' + d.echelle.toFixed(4) + ')';

    // --- fondu de bouclage ------------------------------------------------
    var fondu = 1;
    if (tReel >= T.fondu && tReel < T.remise) fondu = 1 - seg(tReel, T.fondu, T.remise, easeInOut);
    else if (tReel >= T.remise && tReel < T.retour) fondu = 0;
    else if (tReel >= T.retour) fondu = seg(tReel, T.retour, DUREE, easeInOut);
    pages.style.opacity = fondu.toFixed(3);
    annulation.style.opacity = (parseFloat(annulation.style.opacity) * fondu).toFixed(3);
  }

  function rendreA(t) { rendre(t, t); }

  // ---------------------------------------------------------------- lecture
  var params = new URLSearchParams(location.search);
  var fige = params.get('t');
  var reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // État fixe représentatif : la liste cochée, le bandeau, sans doigt.
  var REPRESENTATIF = 5.6;

  var pret = [document.fonts ? document.fonts.ready : Promise.resolve()];
  Array.prototype.forEach.call(document.images, function (img) {
    if (!img.complete) pret.push(new Promise(function (ok) { img.onload = img.onerror = ok; }));
  });
  var attente = Promise.race([Promise.all(pret), new Promise(function (ok) { setTimeout(ok, 2500); })]);

  if (fige !== null || reduit) {
    var instant = fige !== null ? (parseFloat(fige) || 0) : REPRESENTATIF;
    rendreA(instant);
    if (reduit && fige === null) doigt.style.display = 'none';
    attente.then(function () { M = null; rendreA(instant); });
    return;
  }

  var debut = null;
  function image(maintenant) {
    if (debut === null) debut = maintenant;
    rendreA(((maintenant - debut) / 1000) % DUREE);
    requestAnimationFrame(image);
  }
  rendreA(0);
  // On attend la police et les affiches pour que la première boucle ne
  // commence pas sur un écran à moitié chargé.
  attente.then(function () { M = null; requestAnimationFrame(image); });

  var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) { if (e.matches) location.reload(); });
  }
})();
