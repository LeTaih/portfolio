.tjeton.v5{--c: #ff1e8c; --l: #fff; --t: #fff;}
.tjeton.v10{--c: #e6ff3d; --l: #1c0a30; --t: #1c0a30;}
.tjeton.v25{--c: #1c0a30; --l: #e6ff3d; --t: #e6ff3d;}
.tpile{width: 0; height: 0; pointer-events: none;}
.tpile > .tjeton{position: absolute; left: 0; top: 0;}
.tpile .compte{position: absolute; top: -9px; font: 800 14px/18px 'Syne', sans-serif; letter-spacing: -0.02em; white-space: nowrap; color: #fff;}
.tsiege{width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(20, 8, 34, 0.82); box-shadow: inset 0 0 0 2px var(--p), 0 0 18px -6px var(--p), 0 6px 14px -6px #000;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 800 17px/1 'Syne', sans-serif; color: var(--p);
  transition: opacity 240ms var(--ease-out), filter 240ms var(--ease-out);}
.tsiege.is-moi{width: 52px; height: 52px; margin: -26px 0 0 -26px; font-size: 20px;}
.tsiege.is-dehors{opacity: 0.4;}
.tsiege .badge{position: absolute; right: -5px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; display: grid; place-items: center;
  font: 900 10.5px/1 'Archivo'; box-shadow: 0 0 0 2px var(--bg); background: var(--acide); color: #1c0a30;}
.tnom{width: 80px; margin-left: -40px; text-align: center; white-space: nowrap; font: 600 11.5px/1.15 'Archivo'; color: rgba(255, 255, 255, 0.72);}
.tnom.is-gauche{margin-left: -22px; text-align: left;}
.tnom.is-droite{margin-left: -58px; text-align: right;}
.tanneau{border-radius: 50%; pointer-events: none;
  background: conic-gradient(var(--c-anneau, #fff) calc(var(--reste) * 1%), rgba(255, 255, 255, 0.12) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5)); transition: --reste 1s linear;}
.tanneau-s{font: 800 12px/1 'Syne'; color: #fff;}
.tgagne{border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 2px #fff, 0 0 18px 2px rgba(255, 255, 255, 0.45);}
.ttotal{transform-origin: 0 0; font: 800 var(--s, 22px)/0.9 'Syne', sans-serif; letter-spacing: -0.02em; color: #fff; white-space: nowrap;}
.ttotal small{display: block; margin-bottom: 4px; font: 600 12px/1 'Archivo'; letter-spacing: 0; color: var(--lilas);}
.tverdict{translate: -50% -50%; padding: 5px 9px 4px; border-radius: 999px; white-space: nowrap;
  font: 800 12px/1 'Syne', sans-serif; letter-spacing: -0.01em; box-shadow: 0 6px 14px -6px #000;}
.tverdict.gain{background: var(--acide); color: #1c0a30; box-shadow: 0 0 18px -4px rgba(230, 255, 61, 0.7);}
.tverdict.perte{background: rgba(20, 8, 34, 0.9); color: #ff6d88; box-shadow: inset 0 0 0 1px rgba(255, 109, 136, 0.55);}
.tdock{position: fixed; left: 50%; bottom: 0; z-index: 50; width: min(100%, var(--l-colonne));
  translate: -50% 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 1.35rem 1.35rem 0 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025)), rgba(12, 4, 16, 0.62);
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: inset 0 0 0 1px rgba(179, 136, 255, 0.16), 0 -20px 40px -24px #000;}
.tdock-infos{display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px; margin-bottom: 14px;}
.tdock-infos small{display: block; font: 500 12px 'Archivo'; color: var(--muted); margin-bottom: 5px;}
.tdock-infos b{font: 800 26px/0.9 'Syne'; letter-spacing: -0.02em;}
.tdock-consigne{text-align: center; margin: 0 0 12px; font: 600 14px/1.35 'Archivo'; color: rgba(255, 255, 255, 0.86);}
.tdock-consigne small{display: block; margin-top: 4px; font: 500 12px 'Archivo'; color: var(--muted);}
.tdock-actions{display: flex; gap: 10px;}
.tdock-actions > .btn, .tdock-actions > .btn-alt{flex: 1; min-width: 0; height: 56px; padding: 0 8px; white-space: normal; line-height: 1.05;
  text-wrap: balance; letter-spacing: 0.02em; font-size: clamp(12px, 15.21px, 16px);}
.tdock-actions--petit{margin-bottom: 10px;}
.tdock-actions--petit > .btn-alt{height: 40px; font-size: clamp(9.5px, 11.31px, 12px); letter-spacing: 0; padding: 0 4px;}
.tdock-bilan{text-align: center; margin: 2px 0 14px;}
.tdock-bilan b{display: block; font: 800 26px/1 'Syne', sans-serif; letter-spacing: -0.02em;}
.tdock-bilan span{display: block; margin-top: 7px; font: 500 13px 'Archivo'; color: var(--muted);}
.tdock-bilan em{display: inline-block; margin-top: 11px; padding: 7px 13px; border-radius: 999px; font: 600 13px 'Archivo'; font-style: normal;
  background: rgba(179, 136, 255, 0.12); box-shadow: inset 0 0 0 1px rgba(179, 136, 255, 0.3);}
@media (prefers-reduced-motion: reduce){
.table-voile, .tsiege, .tcarte.is-eteinte .face{transition-duration: 160ms;}
.tanneau{transition: none;}
}
.rcase:is(:active, .cy-press):not(:disabled){background: rgba(255, 255, 255, 0.08);}
@media (prefers-reduced-motion: reduce){
}
.table-scene .table-plan, .table-scene .table-surface{transition: opacity 360ms var(--ease-out);}
.ttotal, .tpile .compte, .tnom b, .tanneau-s{text-shadow: 0 0 6px rgba(12, 4, 16, 0.95), 0 1px 2px rgba(0, 0, 0, 0.9);}

</style>
<style>
/* ── Le cadre de la tuile : un téléphone 390×844, mis à l'échelle de l'iframe ── */
html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
#cy-stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; overflow: hidden;
  background: var(--bg); font-family: 'Archivo', system-ui, sans-serif; color: var(--text); }
.cy-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
#cy-host { position: absolute; inset: 0; transition: opacity 420ms var(--ease-out); }
#cy-host.is-out { opacity: 0; }
#cy-host, #cy-host * { pointer-events: none; }
/* Le doigt fictif : un disque blanc translucide. */
#cy-finger { position: absolute; left: 0; top: 0; z-index: 500; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.42), rgba(255,255,255,0.22) 70%);
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.45), 0 8px 22px -8px rgba(0,0,0,0.7);
  pointer-events: none; opacity: 0; translate: 330px 940px;
  transition: translate 440ms var(--ease-in-out), opacity 260ms var(--ease-out), scale 140ms var(--ease-out); }
#cy-finger.is-on { opacity: 1; }
#cy-finger.is-down { scale: 0.8; }
#cy-finger::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.6); opacity: 0; }
#cy-finger.is-tap::after { animation: cyRipple 520ms var(--ease-out) both; }
@keyframes cyRipple { from { opacity: 0.9; transform: scale(0.9); } to { opacity: 0; transform: scale(1.9); } }
@media (prefers-reduced-motion: reduce) { .cy-bg::before { animation: none !important; } #cy-finger { display: none; } }
</style>
</head>
