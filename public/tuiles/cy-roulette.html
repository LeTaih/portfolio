  translate: -50% 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 1.35rem 1.35rem 0 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025)), rgba(12, 4, 16, 0.62);
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: inset 0 0 0 1px rgba(179, 136, 255, 0.16), 0 -20px 40px -24px #000;}
.tdock-infos{display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px; margin-bottom: 14px;}
.tdock-infos small{display: block; font: 500 12px 'Archivo'; color: var(--muted); margin-bottom: 5px;}
.tdock-infos b{font: 800 26px/0.9 'Syne'; letter-spacing: -0.02em;}
.tdock-infos .m{text-align: center; font: 600 12.5px/1.3 'Archivo'; color: rgba(255, 255, 255, 0.7); align-self: center;}
.tdock-consigne{text-align: center; margin: 0 0 12px; font: 600 14px/1.35 'Archivo'; color: rgba(255, 255, 255, 0.86);}
.tdock-consigne small{display: block; margin-top: 4px; font: 500 12px 'Archivo'; color: var(--muted);}
.tdock-actions{display: flex; gap: 10px;}
.tdock-actions > .btn, .tdock-actions > .btn-alt{flex: 1; min-width: 0; height: 56px; padding: 0 8px; white-space: normal; line-height: 1.05;
  text-wrap: balance; letter-spacing: 0.02em; font-size: clamp(12px, 15.21px, 16px);}
.tdock-actions:has(> :nth-child(3)) > *{font-size: clamp(10px, 12.87px, 14px); letter-spacing: 0; padding: 0 4px;}
.tdock-bilan{text-align: center; margin: 2px 0 14px;}
.tdock-bilan b{display: block; font: 800 26px/1 'Syne', sans-serif; letter-spacing: -0.02em;}
.tdock-bilan span{display: block; margin-top: 7px; font: 500 13px 'Archivo'; color: var(--muted);}
.tdock-bilan small{display: block; margin-top: 3px; font: 500 12px 'Archivo'; color: var(--muted);}
@media (prefers-reduced-motion: reduce){
.table-voile, .tsiege, .tcarte.is-eteinte .face{transition-duration: 160ms;}
.tanneau{transition: none;}
}
.rl-plan .rl-n{font: 800 12px 'Syne', sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central;}
.rl-plan .rl-n--red{fill: #ff6d88;}
.rl-plan .rl-n--green{fill: #34e0a0;}
.rl-plan .rl-lab{font-size: 8.5px; text-anchor: middle; dominant-baseline: central;}
.rl-plan.is-verrou .imprime{stroke: rgba(179, 136, 255, 0.85);}
.rroue{width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.8);}
.rroue-disque{position: absolute; inset: 0; width: 100%; height: 100%;}
.rroue-n{font: 700 5px 'Archivo', sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central;}
.rorbite{position: absolute; inset: 0; pointer-events: none;}
.rbille{position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle at 35% 30%, #fff, #d9d2e8); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); transition: opacity 200ms var(--ease-out);}
.rcases{left: 0; top: 0;}
.rcase{border: 0; padding: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
.rcase:is(:active, .cy-press):not(:disabled){background: rgba(255, 255, 255, 0.08);}
.rcase:disabled{cursor: default;}
.rdolly{width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 26; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 38% 32%, #fff, #b9a6ea 70%); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.6);}
.rgagnante{border-radius: 3px; pointer-events: none; background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 0 2px #fff, 0 0 14px rgba(255, 255, 255, 0.55); animation: rgagne 220ms var(--ease-out) both;}
@keyframes rgagne{ from { opacity: 0; scale: 0.98; } }
.rannonce{translate: -50% -50%; display: flex; flex-direction: column; align-items: center; text-align: center; pointer-events: none;}
.rannonce b{font: 800 28px/0.9 'Syne', sans-serif; letter-spacing: -0.02em;}
.rannonce small{margin-top: 4px; font: 600 11px/1.2 'Archivo'; color: rgba(255, 255, 255, 0.72); white-space: nowrap;}
.rannonce--red b, .rannonce-avant .rannonce--red{color: #ff6d88;}
.rannonce--black b, .rannonce-avant .rannonce--black{color: #fff;}
.rannonce--green b, .rannonce-avant .rannonce--green{color: #34e0a0;}
.rannonce-avant{display: flex; gap: 5px; margin-top: 7px; font: 800 11px/1 'Syne'; font-style: normal; opacity: 0.7;}
.rannonce-avant i{font-style: normal;}
.rannonce--grande{animation: rannonce 240ms var(--ease-out) both;}
.rannonce--grande b{font-size: 64px;}
.rannonce--grande small{font-size: 14px;}
@keyframes rannonce{ from { opacity: 0; scale: 0.96; } }
@media (prefers-reduced-motion: reduce){
.rgagnante, .rannonce--grande{animation-name: rfondu; animation-duration: 160ms;}
@keyframes rfondu{ from { opacity: 0; } }
}
.rjetons{display: flex; justify-content: center; gap: 18px; margin: 0 0 12px;}
.rjetons .tjeton{position: relative; margin: 0; border: 0; padding: 0; font: 800 15px 'Syne'; cursor: pointer; transition: translate 160ms var(--ease-out), opacity 160ms var(--ease-out);}
.rjetons .tjeton.is-actif{translate: 0 -5px; box-shadow: 0 0 0 2px #fff, 0 8px 14px -6px rgba(0, 0, 0, 0.8);}
.rjetons .tjeton:disabled{opacity: 0.32; cursor: not-allowed;}
.table-scene .table-plan, .table-scene .table-surface{transition: opacity 360ms var(--ease-out);}
.tdock-infos .m .rjetons{margin: 0; gap: 10px;}
.tdock-actions.rl-actions > .rl-icone{flex: 0 0 48px; padding: 0; font: 700 21px/1 'Archivo', sans-serif; letter-spacing: 0;}
.tdock-actions.rl-actions > :last-child{font-size: clamp(12px, 14.04px, 15px); letter-spacing: 0.02em; padding: 0 8px;}

</style>
<style>
/* ── Le cadre de la tuile : un téléphone 390×844, mis à l'échelle de l'iframe ── */
html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
#cy-stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; overflow: hidden;
  background: var(--bg); font-family: 'Archivo', system-ui, sans-serif; color: var(--text); }
.cy-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
#cy-host { position: absolute; inset: 0; transition: opacity 420ms var(--ease-out); }
#cy-host.is-out { opacity: 0; }
#cy-host, #cy-host * { pointer-events: none; }
/* Le doigt fictif : un disque blanc translucide. */
#cy-finger { position: absolute; left: 0; top: 0; z-index: 500; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.42), rgba(255,255,255,0.22) 70%);
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.45), 0 8px 22px -8px rgba(0,0,0,0.7);
  pointer-events: none; opacity: 0; translate: 330px 940px;
  transition: translate 440ms var(--ease-in-out), opacity 260ms var(--ease-out), scale 140ms var(--ease-out); }
#cy-finger.is-on { opacity: 1; }
#cy-finger.is-down { scale: 0.8; }
#cy-finger::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.6); opacity: 0; }
#cy-finger.is-tap::after { animation: cyRipple 520ms var(--ease-out) both; }
@keyframes cyRipple { from { opacity: 0.9; transform: scale(0.9); } to { opacity: 0; transform: scale(1.9); } }
@media (prefers-reduced-motion: reduce) { .cy-bg::before { animation: none !important; } #cy-finger { display: none; } }
</style>

<script>// L'HORLOGE DE LA TUILE. Sans `?t=`, rien : la tuile vit au temps réel.
// Avec `?t=<s>`, le temps devient VIRTUEL — minuteurs, rAF, Date.now,
// performance.now, animations Web et transitions CSS — et la manche est jouée
// d'un trait jusqu'à l'instant demandé, puis figée. Même script, mêmes
// minuteurs : l'image figée est celle qu'on verrait en direct à cet instant.
(function () {
  var q = new URLSearchParams(location.search).get('t');
  if (q === null) return;
  var cible = Math.max(0, parseFloat(q) || 0) * 1000;
  var origine = { date: Date.UTC(2026, 9, 11, 20, 0, 0), perf: 1000 };
  var maintenant = 0;
  var minuteurs = new Map();
  var images = new Map();
  var seq = 1;

  window.setTimeout = function (fn, ms) {
    var args = Array.prototype.slice.call(arguments, 2);
    var id = seq++;
    minuteurs.set(id, { at: maintenant + Math.max(0, +ms || 0), fn: fn, args: args, id: id, rep: 0 });
    return id;
  };
  window.setInterval = function (fn, ms) {
    var args = Array.prototype.slice.call(arguments, 2);
    var id = seq++;
    var p = Math.max(1, +ms || 0);
    minuteurs.set(id, { at: maintenant + p, fn: fn, args: args, id: id, rep: p });
    return id;
  };
  window.clearTimeout = window.clearInterval = function (id) { minuteurs.delete(id); };
  var vraiRaf = window.requestAnimationFrame.bind(window);
  var fini = false;
  // Figé, une image demandée part au vrai rAF : le temps ne bouge plus, elle
  // redessine la même chose (et l'outil qui attend une image n'attend pas).
  window.requestAnimationFrame = function (fn) {
    if (fini) return vraiRaf(function () { fn(origine.perf + maintenant); });
    var id = seq++; images.set(id, fn); return id;
  };
  window.cancelAnimationFrame = function (id) { images.delete(id); };
  Date.now = function () { return origine.date + maintenant; };
  performance.now = function () { return origine.perf + maintenant; };

  // Les animations : chacune est arrêtée à sa naissance, puis posée à
  // (maintenant - naissance) ; finie, elle est terminée pour de bon (ses
  // promesses `finished` se résolvent, comme en vrai).
  var naissances = new Map();
  // Toutes celles déjà vues : une animation finie qui « remplit » reste dans
  // getAnimations(), elle ne doit pas être reprise de zéro.
  var vues = new WeakSet();
  var animate = Element.prototype.animate;
  Element.prototype.animate = function () {
    var a = animate.apply(this, arguments);
    a.pause();
    a.currentTime = 0;
    naissances.set(a, maintenant);
    vues.add(a);
    return a;
  };
  function piloter() {
    document.getAnimations().forEach(function (a) {
      if (vues.has(a)) return;
      vues.add(a);
      naissances.set(a, maintenant);
      try { a.pause(); } catch (e) { console.warn('[horloge] pause', e && e.message); }
    });
    naissances.forEach(function (t0, a) {
      if (a.playState === 'idle') { naissances.delete(a); return; }
      try {
        var fin = a.effect ? a.effect.getComputedTiming().endTime : 0;
        var t = maintenant - t0;
        if (isFinite(fin) && t >= fin) { naissances.delete(a); a.finish(); }
        else a.currentTime = t;
      } catch (e) { console.warn('[horloge]', e && e.message); naissances.delete(a); }
    });
  }

  var canal = new MessageChannel();
  var attente = [];
  canal.port1.onmessage = function () { var f = attente.shift(); if (f) f(); };
  // Laisse React (ordonnanceur sur MessageChannel) et les microtâches finir.
  function souffler() { return new Promise(function (ok) { attente.push(ok); canal.port2.postMessage(0); }); }
  async function calme() { for (var i = 0; i < 4; i++) await souffler(); }

  var IMAGE = 32; // une image toutes les 32 ms virtuelles (entier : pas de point fixe flottant)
  async function avancer(jusqua) {
    await calme();
    piloter();
    var prochaineImage = IMAGE;
    while (maintenant < jusqua) {
      var t = jusqua;
      minuteurs.forEach(function (m) { if (m.at < t) t = m.at; });
      if (images.size && prochaineImage < t) t = prochaineImage;
      maintenant = Math.max(maintenant, t);
      // Les minuteurs échus, dans l'ordre de leur échéance.
      var dus = [];
      minuteurs.forEach(function (m) { if (m.at <= maintenant) dus.push(m); });
      dus.sort(function (a, b) { return a.at - b.at || a.id - b.id; });
      for (var i = 0; i < dus.length; i++) {
        var m = dus[i];
        if (!minuteurs.has(m.id)) continue;
        if (m.rep) m.at += m.rep; else minuteurs.delete(m.id);
        try { if (typeof m.fn === 'function') m.fn.apply(window, m.args); } catch (e) { console.error(e); }
      }
      if (maintenant >= prochaineImage) {
        prochaineImage = maintenant + IMAGE;
        var lot = Array.from(images.values());
        images.clear();
        lot.forEach(function (f) { try { f(origine.perf + maintenant); } catch (e) { console.error(e); } });
      }
      await calme();
      piloter();
    }
    // La dernière image, exactement à l'instant demandé.
    var lot2 = Array.from(images.values());
    images.clear();
    lot2.forEach(function (f) { try { f(origine.perf + maintenant); } catch (e) { console.error(e); } });
    try { await calme(); piloter(); }
    catch (e) { console.error('[horloge]', e); }
    finally {
      fini = true;
      images.forEach(function (f) { vraiRaf(function () { f(origine.perf + maintenant); }); });
      images.clear();
      document.documentElement.setAttribute('data-fige', String(jusqua / 1000)); }
  }

  window.__cyHorloge = { fige: cible, avancer: avancer };
})();
</script>
