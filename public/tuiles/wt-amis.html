            '<span class="mt-1.5 block text-sm text-white/80">«&nbsp;' + RECO.mot + '&nbsp;»</span></span>' +
        '</div></li></ul></section>' +
    '<section><h2 class="' + H2 + '">Mes amis</h2><ul class="mt-2 flex flex-col gap-1">' +
      AMIS.map(function (a) {
        return '<li class="flex items-center justify-between gap-3 rounded-xl px-3 py-2.5 text-sm odd:bg-voile-doux">' +
          '<span class="min-w-0 flex-1"><span class="block truncate font-medium">' + a + '</span></span>' +
          '<span class="shrink-0 text-xs font-medium text-white/40">Retirer</span></li>';
      }).join('') + '</ul></section>' +
    '<section class="mt-8"><h2 class="' + H2 + '">Ces 30 jours</h2><ol class="mt-2 flex flex-col gap-1">' +
      CLASSEMENT.map(function (l) {
        var moi = l[1] === null;
        return '<li class="flex items-center gap-3 rounded-2xl px-3 py-2.5 text-sm ' + (moi ? 'bg-voile-fort inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet' : 'odd:bg-voile-doux') + '">' +
          '<span class="w-4 shrink-0 tabular-nums text-white/40">' + l[0] + '</span>' +
          (moi ? '<span class="min-w-0 flex-1 truncate font-semibold">Toi</span>' : '<span class="min-w-0 flex-1 truncate font-medium">' + l[1] + '</span>') +
          '<span class="shrink-0 tabular-nums ' + (moi ? 'font-semibold' : 'text-white/60') + '">' + l[2] + '</span></li>';
      }).join('') + '</ol></section>' +
    '<section class="mt-8" id="flux"><h2 class="' + H2 + '">Ces derniers jours</h2><ul class="mt-2 flex flex-col gap-3">' +
      FLUX.map(function (f, i) {
        return '<li class="rounded-3xl bg-voile p-3 inset-ring-1 inset-ring-filet backdrop-blur-surface shadow-reflet">' +
          '<p class="text-sm"><span class="font-medium">' + f.qui + '</span> <span class="text-white/70" id="lien' + i + '">' + f.quoi + '</span></p>' +
          '<p class="mt-0.5 text-xs text-white/40">' + f.quand + '</p>' +
          '<div class="mt-2 flex gap-2">' + EMOJIS.map(function (e) {
            var n = f.reactions[e] || 0;
            return '<span class="reaction rounded-full px-3 py-1.5 text-sm bg-voile-fort text-white/70" data-flux="' + i + '" data-emoji="' + e + '">' + e +
              '<span class="ml-1 text-xs tabular-nums compte">' + (n > 0 ? n : '') + '</span></span>';
          }).join('') + '</div></li>';
      }).join('') + '</ul></section>';

  // ---------------------------------------------------------------- le film
  var PILULE = 'flex min-h-11 flex-1 items-center justify-center gap-2 rounded-full px-4 text-sm inset-ring-1 ';
  document.getElementById('film').innerHTML =
    '<a class="retour">' + CHEVRON + '<span class="truncate">Retour</span></a>' +
    '<div class="mt-4"><div class="flex items-start gap-3">' +
      '<img src="' + IMG + 'w342' + FILM.affiche + '" alt="" class="h-24 w-16 shrink-0 rounded-xl object-cover">' +
      '<div class="min-w-0 flex-1">' +
        '<img class="logo" src="' + IMG + 'w300' + FILM.logo + '" alt="">' +
        '<p class="mt-1.5 text-sm text-white/40">' + FILM.meta + '</p>' +
        '<p class="mt-1 text-sm text-white/60"><span class="font-semibold tabular-nums text-white">' + FILM.note + '</span><span class="text-white/40"> /10 · ' + FILM.votes + ' votes</span></p>' +
      '</div></div>' +
      '<p class="mt-3 text-sm italic text-white/60">« ' + FILM.accroche + ' »</p></div>' +
    '<p class="mt-3 text-sm text-white/40">' + FILM.sortie + '</p>' +
    '<p class="mt-1 text-sm text-white/40">Réalisé par <span class="text-white/70">Paul Thomas Anderson</span></p>' +
    '<p class="mt-3 text-sm leading-relaxed text-white/70">' + FILM.resume + '</p>' +
    '<div class="mt-4"><div class="relative block aspect-video w-full overflow-hidden rounded-3xl inset-ring-1 inset-ring-filet shadow-reflet">' +
      '<img src="wt-amis/bande-annonce.jpg" alt="" class="absolute inset-0 h-full w-full object-cover">' +
      '<span class="absolute inset-0 bg-black/30"></span>' +
      '<span class="absolute inset-0 flex items-center justify-center"><span class="flex items-center gap-2 rounded-full bg-voile-fort px-5 py-3 text-sm font-medium text-white inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>Bande-annonce</span></span>' +
    '</div></div>' +
    '<section class="relative mt-4 overflow-hidden rounded-3xl bg-voile p-4 inset-ring-1 inset-ring-filet backdrop-blur-surface shadow-reflet">' +
      '<h2 class="' + H2 + '">Où le regarder</h2>' +
      '<ul class="mt-3 flex flex-wrap gap-2"><li class="flex items-center gap-2"><img src="' + IMG + 'w92' + FILM.plateforme[1] + '" alt="" class="h-9 w-9 shrink-0 rounded-2xl object-cover"><span class="text-sm text-white/80">' + FILM.plateforme[0] + '</span></li></ul>' +
      '<p class="mt-3 text-xs text-white/40">Aussi en location ou à l’achat.</p>' +
      '<a class="mt-3 inline-block text-sm text-white/60">Toutes les offres</a></section>' +
    // ActionsFilm : dans la watchlist, pas encore vu
    '<div class="mt-4 flex gap-2">' +
      '<span class="' + PILULE + 'bg-voile text-white/70 inset-ring-filet backdrop-blur-controle shadow-reflet">Vu</span>' +
      '<span class="' + PILULE + 'bg-white font-semibold text-neutral-950 inset-ring-white">' + CHECK(16) + 'À voir</span></div>' +
    '<div class="mt-4"><div class="flex flex-col gap-2"><span class="flex h-11 shrink-0 self-start items-center rounded-full bg-voile-fort px-4 text-sm font-medium text-white inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet">Ajouter à une liste</span></div></div>' +
    // RecommanderBouton
    '<div class="mt-3"><div class="flex flex-col gap-2">' +
      '<span class="flex h-11 shrink-0 items-center justify-center rounded-full bg-voile-fort px-4 text-sm font-medium text-white inset-ring-1 inset-ring-filet-fort backdrop-blur-controle shadow-reflet" id="conseiller">Conseiller à un ami</span>' +
      '<div class="rounded-3xl bg-voile p-3 inset-ring-1 inset-ring-filet backdrop-blur-surface shadow-reflet" id="panneau" style="display:none">' +
        '<p class="px-1 ' + H2 + '">À qui ?</p>' +
        '<div class="mt-2 flex flex-wrap gap-2">' + AMIS.map(function (a, i) {
          return '<span class="ami relative flex h-11 max-w-full items-center overflow-hidden truncate rounded-full px-4 text-sm bg-voile-fort text-white/70 inset-ring-1 inset-ring-filet" data-i="' + i + '"><span class="plein absolute inset-0 rounded-full bg-white" style="opacity:0"></span><span class="relative nom">' + a + '</span></span>';
        }).join('') + '</div>' +
        '<div class="mt-3 flex h-11 w-full items-center rounded-full bg-voile-fort px-4 text-sm text-white/40 inset-ring-1 inset-ring-filet">Un mot ? (facultatif)</div>' +
        '<span class="bouton-envoyer mt-3 flex h-11 w-full items-center justify-center rounded-full bg-white text-sm font-semibold text-neutral-950" id="envoyer">Envoyer</span>' +
      '</div>' +
    '</div></div>' +
    '<ul class="mt-4 flex flex-wrap gap-2">' + FILM.motsCles.map(function (m) {
      return '<li class="rounded-full bg-voile px-3 py-1.5 text-xs text-white/60 inset-ring-1 inset-ring-filet">' + m + '</li>';
    }).join('') + '</ul>' +
    // Distribution : une rangée de portraits qui défile
    '<section class="mt-8"><h2 class="' + H2 + '">Distribution</h2><ul class="-mx-4 mt-3 flex gap-3 overflow-hidden px-4 pb-1">' +
      FILM.distribution.map(function (p) {
        return '<li class="w-20 shrink-0"><img src="' + IMG + 'w185' + p[2] + '" alt="" class="portrait">' +
          '<p class="nom2 mt-1.5 font-medium">' + p[0] + '</p><p class="nom2 mt-0.5 text-white/40">' + p[1] + '</p></li>';
      }).join('') + '</ul></section>';

  // ---------------------------------------------------------------- références
  var ecran = document.getElementById('ecran');
  var doigt = document.getElementById('doigt');
  var pages = document.getElementById('pages');
  var pageAmis = document.getElementById('pageAmis');
  var pageFilm = document.getElementById('pageFilm');
  var defileAmis = document.getElementById('defileAmis');
  var defileFilm = document.getElementById('defileFilm');
  var ongletAmis = document.getElementById('ongletAmis');
  var conseiller = document.getElementById('conseiller');
  var panneau = document.getElementById('panneau');
  var envoyer = document.getElementById('envoyer');
  var feu = document.querySelector('.reaction[data-flux="1"][data-emoji="🔥"]');
  var feuCompte = feu.querySelector('.compte');
  var lienFilm = document.getElementById('lien0');
  var ami = document.querySelectorAll('#panneau .ami')[DESTINATAIRE];
  var amiPlein = ami.querySelector('.plein');
  var amiNom = ami.querySelector('.nom');

  var echelle = 1;
  function ajuster() {
    echelle = window.innerWidth / 390;
    ecran.style.transform = 'scale(' + echelle + ')';
    document.body.style.height = (844 * echelle) + 'px';
  }
  ajuster();
  window.addEventListener('resize', ajuster);

  function bezier(x1, y1, x2, y2) {
    function a(p1, p2) { return 1 - 3 * p2 + 3 * p1; }
    function b(p1, p2) { return 3 * p2 - 6 * p1; }
    function c(p1) { return 3 * p1; }
    function calc(t, p1, p2) { return ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t; }
    function pente(t, p1, p2) { return 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1); }
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x;
      for (var i = 0; i < 8; i++) {
        var d = pente(t, x1, x2);
        if (Math.abs(d) < 1e-6) break;
        t -= (calc(t, x1, x2) - x) / d;
      }
      t = Math.min(1, Math.max(0, t));
      return calc(t, y1, y2);
    };
  }
  var easeOut = bezier(0, 0, 0.2, 1);       // Tailwind ease-out
  var easeInOut = bezier(0.4, 0, 0.2, 1);   // Tailwind ease-in-out
  function seg(t, a, b, f) {
    if (t <= a) return 0;
    if (t >= b) return 1;
    return (f || easeOut)((t - a) / (b - a));
  }
  function lerp(a, b, p) { return a + (b - a) * p; }

  // Un défilement au doigt : le contenu suit le doigt (accélération), puis
  // file sur sa lancée et ralentit comme un UIScrollView (décroissance
  // exponentielle, vitesse continue au lâcher).
  function defilement(t, g) {
    var duree = g.t1 - g.t0;
    if (t <= g.t0) return 0;
    if (t < g.t1) {
      var p = (t - g.t0) / duree;
      return g.drag * (1.5 * p * p - 0.5 * p * p * p);
    }
    if (g.coast <= 0) return g.drag;
    var vitesse = 1.5 * g.drag / duree;
    var tau = g.coast / vitesse;
    var x = Math.min(4, (t - g.t1) / tau);
    return g.drag + g.coast * (1 - Math.exp(-x)) / (1 - Math.exp(-4));
  }

  // ---------------------------------------------------------------- mesures
  function haut(el, conteneur) {
    var y = 0;
    while (el && el !== conteneur) { y += el.offsetTop; el = el.offsetParent; }
    return y;
  }
  function gauche(el, conteneur) {
    var x = 0;
    while (el && el !== conteneur) { x += el.offsetLeft; el = el.offsetParent; }
    return x;
  }
  function centre(el, conteneur) {
    return { x: gauche(el, conteneur) + el.offsetWidth / 2, y: haut(el, conteneur) + el.offsetHeight / 2 };
  }


  // ---------------------------------------------------------------- scénario
  var DUREE = 12.4;
  var T = {
    g1: { apparait: 0.95, t0: 1.20, t1: 1.70 },
    reaction: { apparait: 2.75, appui: 3.00, lache: 3.10 }, majReaction: 3.45,
    lien: { apparait: 3.85, appui: 4.10, lache: 4.20 }, navigue: 4.42,
    g2: { apparait: 5.30, t0: 5.52, t1: 6.02 },
    conseiller: { apparait: 7.00, appui: 7.25, lache: 7.35 },
    ami: { apparait: 7.75, appui: 8.00, lache: 8.10 },
    envoyer: { apparait: 8.50, appui: 8.75, lache: 8.85 }, envoye: 9.30, finEnvoye: 11.30,
    fondu: 11.0, remise: 11.6, retour: 11.75
  };
  var M = null;
  function mesurer() {
    var S1 = Math.min(haut(document.getElementById('flux'), defileAmis) - 70, defileAmis.offsetHeight + 112 - 844);
    var S2 = haut(conseiller, defileFilm) - 330;
    M = {
      g1: { t0: T.g1.t0, t1: T.g1.t1, drag: S1 * 0.55, coast: S1 * 0.45 },
      g2: { t0: T.g2.t0, t1: T.g2.t1, drag: S2 / 2.36, coast: S2 - S2 / 2.36 }
    };
  }

  function toucher(t, k) {
    var entre = seg(t, k.apparait, k.apparait + 0.25);
    var sort = seg(t, k.lache, k.lache + 0.35);
    return {
      op: entre * (1 - sort),
      echelle: lerp(1.25, 1, entre) * lerp(1, 0.86, seg(t, k.appui, k.appui + 0.1)) * lerp(1, 1 / 0.86, sort),
      dx: 10 * (1 - entre), dy: 14 * (1 - entre)
    };
  }
  function presse(t, k, ampleur) {
    return 1 - ampleur * seg(t, k.appui, k.appui + 0.1) * (1 - seg(t, k.lache, k.lache + 0.25));
  }
  function poser(el, prop, valeur) {
    if (el['_' + prop] !== valeur) { el.style[prop] = valeur; el['_' + prop] = valeur; }
  }

  function rendre(t, tReel) {
    if (!M) mesurer();
    if (t >= T.remise) t = 0;

    // --- navigation : le lien du flux ouvre la fiche du film
    var vers = seg(t, T.navigue, T.navigue + 0.16, easeInOut);
    poser(pageAmis, 'opacity', (1 - vers).toFixed(3));
    poser(pageAmis, 'visibility', vers >= 1 ? 'hidden' : 'visible');
    poser(pageFilm, 'opacity', vers.toFixed(3));
    poser(pageFilm, 'visibility', vers <= 0 ? 'hidden' : 'visible');
    var surAmis = t < T.navigue;
    if (ongletAmis.classList.contains('actif') !== surAmis) ongletAmis.classList.toggle('actif', surAmis);

    var sA = Math.min(defilement(t, M.g1), defileAmis.offsetHeight + 112 - 844);
    // le panneau refermé, la page raccourcit : le navigateur ramène le défilement dans ses bornes
    poser(panneau, 'display', (t >= T.conseiller.lache && t < T.envoye) ? 'block' : 'none');
    var sF = Math.min(defilement(t, M.g2), defileFilm.offsetHeight + 112 - 844);
    poser(defileAmis, 'transform', 'translate3d(0,' + (-sA).toFixed(2) + 'px,0)');
    poser(defileFilm, 'transform', 'translate3d(0,' + (-sF).toFixed(2) + 'px,0)');

    // --- la réaction 🔥 : action serveur, la pastille blanchit au retour
    var reagi = t >= T.majReaction;
    feu.className = 'reaction rounded-full px-3 py-1.5 text-sm ' + (reagi ? 'bg-white text-neutral-950' : 'bg-voile-fort text-white/70');
    var n = reagi ? '1' : '';
    if (feuCompte.textContent !== n) feuCompte.textContent = n;
    poser(feu, 'transform', 'scale(' + presse(t, T.reaction, 0.04).toFixed(4) + ')');
    poser(lienFilm, 'color', (t >= T.lien.appui && t < T.navigue) ? 'rgb(255 255 255)' : '');

    // --- le panneau « Conseiller à un ami »
    var libelle = t >= T.envoye && t < T.finEnvoye ? 'Envoyé !' : 'Conseiller à un ami';
    if (conseiller.textContent !== libelle) conseiller.textContent = libelle;
    poser(conseiller, 'transform', 'scale(' + presse(t, T.conseiller, 0.04).toFixed(4) + ')');
    // le destinataire : transition-all 300 ms vers le blanc plein
    var choisi = seg(t, T.ami.lache, T.ami.lache + 0.3);
    amiPlein.style.opacity = choisi.toFixed(3);
    var v = Math.round(lerp(255, 10, choisi));
    amiNom.style.color = 'rgb(' + v + ',' + v + ',' + v + ',' + lerp(0.7, 1, choisi).toFixed(3) + ')';
    amiNom.style.fontWeight = choisi > 0.5 ? '600' : '';
    poser(ami, 'transform', 'scale(' + presse(t, T.ami, 0.04).toFixed(4) + ')');
    // « Envoyer » : disabled:opacity-40 tant que personne n'est choisi, « … » le temps de l'action
    envoyer.style.opacity = lerp(0.4, 1, choisi).toFixed(3);
    var mot = t >= T.envoyer.lache && t < T.envoye ? '…' : 'Envoyer';
    if (envoyer.textContent !== mot) envoyer.textContent = mot;
    poser(envoyer, 'transform', 'scale(' + presse(t, T.envoyer, 0.04).toFixed(4) + ')');

    // --- le doigt
    var d = { op: 0, echelle: 1, x: 0, y: 0 };
    function surCible(k, el, conteneur, defile, decaleX) {
      var c = centre(el, conteneur);
      var f = toucher(t, k);
      d.op = f.op; d.echelle = f.echelle;
      d.x = c.x + (decaleX || 0) + f.dx;
      d.y = c.y - defile + f.dy;
    }
    function glisse(g, m, x, y0) {
      var entre = seg(t, g.apparait, g.apparait + 0.25);
      var leve = seg(t, g.t1, g.t1 + 0.3);
      var tire = defilement(Math.min(t, g.t1), m);
      d.op = entre * (1 - leve);
      d.echelle = lerp(1.25, 1, entre) * lerp(1, 0.86, seg(t, g.t0, g.t0 + 0.1)) * lerp(1, 1 / 0.86, leve);
      d.x = x;
      d.y = y0 - tire - 26 * leve;
    }
    if (t < T.g1.t1 + 0.4) glisse(T.g1, M.g1, 250, 680);
    else if (t < T.lien.apparait - 0.05) surCible(T.reaction, feu, defileAmis, sA);
    else if (t < T.g2.apparait - 0.05) surCible(T.lien, lienFilm, defileAmis, sA, -40);
    else if (t < T.g2.t1 + 0.4) glisse(T.g2, M.g2, 240, 690);
    else if (t < T.ami.apparait - 0.05) surCible(T.conseiller, conseiller, defileFilm, sF, 40);
    else if (t < T.envoyer.apparait - 0.05) surCible(T.ami, ami, defileFilm, sF);
    else surCible(T.envoyer, envoyer, defileFilm, sF, 30);
    doigt.style.opacity = (d.op * 0.95).toFixed(3);
    doigt.style.transform = 'translate3d(' + d.x.toFixed(2) + 'px,' + d.y.toFixed(2) + 'px,0) scale(' + d.echelle.toFixed(4) + ')';

    // --- fondu de bouclage
    var fondu = 1;
    if (tReel >= T.fondu && tReel < T.remise) fondu = 1 - seg(tReel, T.fondu, T.remise, easeInOut);
    else if (tReel >= T.remise && tReel < T.retour) fondu = 0;
    else if (tReel >= T.retour) fondu = seg(tReel, T.retour, DUREE, easeInOut);
    pages.style.opacity = fondu.toFixed(3);
  }

  function rendreA(t) { rendre(t, t); }

  // ---------------------------------------------------------------- lecture
  var params = new URLSearchParams(location.search);
  var fige = params.get('t');
  var reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // État fixe représentatif : le flux des amis, la réaction posée, sans doigt.
  var REPRESENTATIF = 3.6;

  var pret = [document.fonts ? document.fonts.ready : Promise.resolve()];
  Array.prototype.forEach.call(document.images, function (img) {
    if (!img.complete) pret.push(new Promise(function (ok) { img.onload = img.onerror = ok; }));
  });
  var attente = Promise.race([Promise.all(pret), new Promise(function (ok) { setTimeout(ok, 2500); })]);

  if (fige !== null || reduit) {
    var instant = fige !== null ? (parseFloat(fige) || 0) : REPRESENTATIF;
    rendreA(instant);
    if (reduit && fige === null) doigt.style.display = 'none';
    attente.then(function () { M = null; rendreA(instant); });
    return;
  }

  var debut = null;
  function image(maintenant) {
    if (debut === null) debut = maintenant;
    rendreA(((maintenant - debut) / 1000) % DUREE);
    requestAnimationFrame(image);
  }
  rendreA(0);
  attente.then(function () { M = null; requestAnimationFrame(image); });

  var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) { if (e.matches) location.reload(); });
  }
})();
